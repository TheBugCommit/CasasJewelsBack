# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/Entity/'
            - '../src/Domain/ValueObject/'

    #Cache
    Symfony\Component\Cache\Adapter\ApcuAdapter: ~
    Redis:
        class: Redis
        factory: [ 'Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection' ]
        arguments:
            - '%env(REDIS_DSN)%'

    #API Security
    App\Infrastructure\Api\Security\ApiKeyAuthenticator:
        arguments: [ '%env(API_KEY)%' ]

    #AdminSession
    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@Redis'

    #Repositories
    App\Infrastructure\Persistence\DoctrineProductRepository: ~
    App\Infrastructure\Persistence\CachedProductRepository:
        arguments:
            $inner: '@App\Infrastructure\Persistence\DoctrineProductRepository'

    App\Domain\Repository\ProductRepositoryInterface: '@App\Infrastructure\Persistence\DoctrineProductRepository'

    App\Application\UseCase\Product\GetProductListUseCase:
        arguments:
            $products: '@App\Infrastructure\Persistence\CachedProductRepository'

    App\Application\UseCase\Product\GetProductDetailUseCase:
        arguments:
            $products: '@App\Infrastructure\Persistence\CachedProductRepository'

    App\Infrastructure\Cache\LayeredCache:
        arguments:
            $apcu: '@App\Infrastructure\Cache\APCuCache'
            $redis: '@App\Infrastructure\Cache\RedisCache'

    # Stripe
    App\Infrastructure\Service\StripePaymentService:
        arguments:
            $secretKey:  '%env(STRIPE_SECRET_KEY)%'
            $successUrl: '%env(STRIPE_SUCCESS_URL)%'
            $cancelUrl:  '%env(STRIPE_CANCEL_URL)%'

    App\Domain\Service\PaymentServiceInterface:
        alias: App\Infrastructure\Service\StripePaymentService

    App\Infrastructure\Controller\StripeWebhookController:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    # Email
    App\Infrastructure\Service\SymfonyEmailService:
        arguments:
            $senderEmail: '%env(MAILER_SENDER_EMAIL)%'
            $senderName: '%env(MAILER_SENDER_NAME)%'

    App\Domain\Service\EmailServiceInterface:
        alias: App\Infrastructure\Service\SymfonyEmailService

    # Unit of Work
    App\Domain\Repository\UnitOfWorkInterface:
        alias: App\Infrastructure\Persistence\DoctrineUnitOfWork

    # Product Image Upload
    App\Infrastructure\Service\ProductImageUploadService:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/products'
