security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_provider:
            id: App\Infrastructure\Security\Providers\AdminUserProvider

        api_key_provider:
            memory:
                users:
                    api_client: { roles: ['ROLE_API'] }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|css|images|js)/
            security: false

        # API firewall
        api:
            pattern: ^/api
            stateless: true
            provider: api_key_provider
            custom_authenticators:
                - App\Infrastructure\Api\Security\ApiKeyAuthenticator

        # Admin firewall
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_provider
            form_login:
                login_path:    admin_login
                check_path:    admin_login
                default_target_path: /
                enable_csrf:   true
            logout:
                path: admin_logout
                target: admin_login

    access_control:
        - { path: ^/admin/login,  roles: PUBLIC_ACCESS }
        - { path: ^/admin,        roles: ROLE_ADMIN }
        - { path: ^/api,          roles: ROLE_API }
