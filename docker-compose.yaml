services:
    loadbalancer:
        image: nginx:alpine
        ports:
            - "8000:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - backend
        networks:
            - shared_api_network
            - backend_internal

    backend:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        deploy:
            replicas: 3
        volumes:
            - ./:/var/www/html
            - ../CasasJewelsVendor:/var/www/CasasJewelsVendor
        environment:
            DATABASE_URL: "${DATABASE_URL}"
            REDIS_DSN: "${REDIS_DSN}"
            MAILER_DSN: "${MAILER_DSN}"
        depends_on:
            - postgres
            - redis
            - mailhog
        networks:
            - backend_internal

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: "${DB_NAME}"
            POSTGRES_USER: "${DB_USER}"
            POSTGRES_PASSWORD: "${DB_PASSWORD}"
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - backend_internal

    redis:
        image: redis:8-alpine
        ports:
            - "6379:6379"
        networks:
            - backend_internal

    mailhog:
        image: mailhog/mailhog
        ports:
            - "8025:8025"
        networks:
            - backend_internal

    pgadmin:
        image: dpage/pgadmin4:9.8
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: admin
            PGADMIN_CONFIG_SERVER_MODE: 'False'
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
        ports:
            - "5050:80"
        networks:
            - backend_internal

volumes:
    db_data:

networks:
    backend_internal:
        driver: bridge
    shared_api_network:
        name: shared_api_network
        driver: bridge
